[general]
# Find visible top-level game windows containing this text.
window_title_contains=Thần Long

# Child triggers transfer when free slots <= this value.
child_trigger_free_slots=9

# MAIN stops receiving and runs sell when free slots < this value.
main_stop_free_slots=9

# Safety cap for number of bag-grid item clicks in one trade.
# Runtime also caps this against MAIN free space so it cannot blindly overfill.
max_transfer_clicks_per_trade=9

# 5 minutes by default.
bag_check_interval_ms=300000

# Adjustable delays for pure-click flows.
move_settle_ms=3500
trade_invite_settle_ms=900
trade_window_settle_ms=900
post_trade_wait_ms=1800
sell_settle_ms=5000
loop_sleep_ms=250

start_train_on_launch=1
move_to_anchor_on_launch=1
scan_before_start=1
rescan_all_after_trade=1

[click]
# post = PostMessage WM_MOUSE... ; send = SendMessageTimeout WM_MOUSE...
# Neither mode moves the physical mouse cursor.
mode=post
down_up_ms=25

[bag]
# VISUAL scanner only. No internal game API.
enabled=1

# Normalized center of TOP-LEFT slot (0..1 relative to current client size).
# MUST be calibrated to the actual game UI before unattended use.
grid_left=0.000000
grid_top=0.000000

# Expected bag is 10 x 9 = 90 slots; change if the real UI differs.
cols=10
rows=9

# Normalized distance between adjacent slot centers.
step_x=0.000000
step_y=0.000000

sample_half_px=5
color_threshold=38
variance_threshold=650

# Slot used once to capture the EMPTY-slot signature.
# Zero-based indices; default last slot in a 10x9 bag.
calibration_row=8
calibration_col=9

open_macro=bag_open_sort
close_macro=bag_close

[death]
# Pure visual death/revive detector. Disabled until one-time calibration is recorded.
enabled=0

# Normalized center of a small STABLE patch visible only on the death/revive UI.
center_x=0.500000
center_y=0.200000
sample_half_px=8
color_threshold=20
variance_threshold=500
check_interval_ms=1000
recovery_settle_ms=5000
