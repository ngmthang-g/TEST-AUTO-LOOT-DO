name: build-ui-button-probe

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/ui-button-probe/**'
      - '.github/workflows/build-ui-button-probe.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/ui-button-probe/**'
      - '.github/workflows/build-ui-button-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source zip from text parts
        shell: pwsh
        run: |
          $parts = 1..5 | ForEach-Object { "tools/ui-button-probe/source.b64.part$_" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_ -Raw).Trim() }) -join ''
          if ($b64.Length -ne 23460) { throw "Unexpected base64 length: $($b64.Length)" }
          $bytes = [Convert]::FromBase64String($b64)
          if ($bytes.Length -ne 17593) { throw "Unexpected zip length: $($bytes.Length)" }
          [IO.File]::WriteAllBytes('uibuttonprobe-source.zip', $bytes)

      - name: Extract source
        shell: pwsh
        run: |
          $dst = 'uibuttonprobe-src'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Expand-Archive -Path 'uibuttonprobe-source.zip' -DestinationPath $dst -Force
          Get-ChildItem -Recurse $dst | Select-Object FullName

      - name: Configure x64
        shell: pwsh
        run: |
          cmake -S 'uibuttonprobe-src/ThanLong_UIButtonProbe_v0.1.0' -B 'uibuttonprobe-build' -A x64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build 'uibuttonprobe-build' --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'uibuttonprobe-dist' | Out-Null
          Copy-Item 'uibuttonprobe-build/Release/ThanLongUIButtonProbe.exe' 'uibuttonprobe-dist/'
          Copy-Item 'uibuttonprobe-build/Release/ThanLongUIButtonProbeBridge.dll' 'uibuttonprobe-dist/'
          Copy-Item 'uibuttonprobe-src/ThanLong_UIButtonProbe_v0.1.0/README.txt' 'uibuttonprobe-dist/'
          Get-ChildItem 'uibuttonprobe-dist' | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-UIButtonProbe-v0.1.0-win-x64
          path: uibuttonprobe-dist/*
          if-no-files-found: error
