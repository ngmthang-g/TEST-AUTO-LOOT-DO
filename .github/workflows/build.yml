name: build-item-consolidator-v020

on:
  push:
    branches:
      - main
      - agent/item-consolidator-v0.2-gui-donor159
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Route logic self-test
        run: .\build\Release\route_logic_tests.exe

      - name: Rotation logic self-test
        run: .\build\Release\rotation_logic_tests.exe

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.2.0.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
          Copy-Item README.md,PROJECT_KNOWLEDGE.md,CHANGELOG.md stage\
          Copy-Item macros stage\macros -Recurse
          Copy-Item docs\history\VERSION_v0.2.0.md stage\VERSION_v0.2.0.md

      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.2.0-win-x64
          path: stage
