name: build-item-consolidator-v027-r2

on:
  push:
    branches:
      - agent/item-consolidator-v0.2.7-r2-rendezvous-groups
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate exact clean v0.2.7 plus requested R2 patch
        shell: pwsh
        run: .\tools\rehydrate_v027_r2.ps1
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Route logic self-test
        run: .\build\Release\route_logic_tests.exe
      - name: Rotation logic self-test
        run: .\build\Release\rotation_logic_tests.exe
      - name: Exact trade scheduler self-test
        run: .\build\Release\trade_logic_tests.exe
      - name: Static v0.2.7-R2 requested-only audit
        shell: pwsh
        run: |
          $c = Get-Content generated\donor159\src\controller.cpp -Raw
          foreach ($required in @(
            'v0.2.7-R2',
            'tradeRendezvous_',
            'TradeRendezvousMap',
            'TỌA GD • LẤY',
            'BeginTradeRendezvousTravel',
            'HandleTradeRendezvousTravel',
            'tradeTravelReady',
            'FULL exactly is the only entry gate',
            'GroupSelectedTradeRows',
            'UngroupSelectedTradeRows',
            'sequenceGroupRepeatDone',
            'GroupId',
            'GroupRepeat',
            'GOM DÒNG ĐÃ CHỌN',
            'ClickSlot::AutoMenu',
            'DỪNG AUTO 2',
            'underworldFallbackRoute',
            'trainRecoveryFallbackTravel',
            'sellFallbackTravel',
            'DỒN ĐỒ: BẬT',
            'DỒN ĐỒ: TẮT',
            'ReleaseTradeHolds',
            'ToggleGlobalPause',
            'CoordinatorClick',
            'SetForegroundWindow',
            'SetCursorPos',
            'mainSellThreshold_ = 6',
            'childTriggerFreeSlots_ = 0'
          )) {
            if ($c -notmatch [regex]::Escape($required)) { throw "Missing R2 token: $required" }
          }
          foreach ($forbidden in @(
            'tradeSelectPoint',
            'TradeSelect',
            'StopAuto1',
            'tradeGlobalFreeze_',
            'roundRobinCursor_'
          )) {
            if ($c -match [regex]::Escape($forbidden)) { throw "Forbidden/removed token returned: $forbidden" }
          }
          $fullEntry = ([regex]::Matches($c, 'if \(child->snapshot\.freeBagSpace > 0\) continue;')).Count
          if ($fullEntry -ne 1) { throw "Expected exactly one CON FULL entry gate, got $fullEntry" }
          $rawSend = ([regex]::Matches($c, 'SendInput\(')).Count
          if ($rawSend -ne 2) { throw "Unexpected SendInput call count: $rawSend" }
          $autoMenuEnum = ([regex]::Matches($c, 'AutoMenu = 2')).Count
          if ($autoMenuEnum -ne 1) { throw "AUTO merged click slot invariant failed" }
          if ($c -notmatch 'std::array<ClickPoint, 5>') { throw 'Expected exactly five per-account click points' }
          Write-Host 'V0.2.7-R2 STATIC AUDIT PASS: rendezvous/groups/5-click/fallback/toggle/F4 invariants'
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.2.7-R2.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
          Copy-Item README.md,PROJECT_KNOWLEDGE.md,CHANGELOG.md stage\
          Copy-Item macros stage\macros -Recurse
          Copy-Item docs\history\VERSION_v0.2.7-R2.md stage\VERSION_v0.2.7-R2.md
          Copy-Item docs\bugs\BUG_REGISTRY.md stage\BUG_REGISTRY.md
          Copy-Item docs\decisions\DECISIONS.md stage\DECISIONS.md
          Copy-Item docs\evidence\EVIDENCE_REGISTRY.md stage\EVIDENCE_REGISTRY.md
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.2.7-R2-win-x64
          path: stage
