name: Build NPC GameDialog Probe

on:
  push:
    branches: [ main, fix-probe-v0.1.4 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.1.4 source normalization
        shell: pwsh
        run: |
          if (Test-Path scripts/apply_v014.py) {
            python scripts/apply_v014.py
            Remove-Item scripts/apply_v014.py -Force
          }

      - name: Commit normalized source back to test branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix-probe-v0.1.4'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Normalize source for probe v0.1.4"
            git push origin HEAD:fix-probe-v0.1.4
          }

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/ThanLongNpcDialogProbe.exe artifact/
          Copy-Item build/Release/ThanLongNpcDialogProbeBridge.dll artifact/
          Copy-Item README.md artifact/
          Compress-Archive -Path CMakeLists.txt,README.md,src,.github -DestinationPath artifact/ThanLongNpcDialogProbe_v0.1.4_Source.zip -Force
          Get-FileHash artifact/ThanLongNpcDialogProbe.exe -Algorithm SHA256
          Get-FileHash artifact/ThanLongNpcDialogProbeBridge.dll -Algorithm SHA256

      - name: Upload EXE + DLL + source
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongNpcDialogProbe-v0.1.4-win64
          path: artifact/*
          if-no-files-found: error
