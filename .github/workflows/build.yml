name: build-item-consolidator

on:
  push:
    branches: [ main, agent/item-consolidator-v0.1 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ThanLongItemConsolidator.exe dist/
          Copy-Item README.md dist/
          Copy-Item PROJECT_KNOWLEDGE.md dist/
          Copy-Item docs -Destination dist/docs -Recurse
          Copy-Item config -Destination dist/config -Recurse
          Copy-Item macros -Destination dist/macros -Recurse

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.1.0-win-x64
          path: dist/**
          if-no-files-found: error
