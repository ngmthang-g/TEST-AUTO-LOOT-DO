name: build-remote-loot-poc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure x64
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/RemoteLootProbe.exe dist/
          Copy-Item build/Release/RemoteLootBridge.dll dist/
          Copy-Item README.md dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteLootPoC-v0.1.0-win-x64
          path: dist/*
          if-no-files-found: error
