name: build-item-consolidator-v027-r3

on:
  push:
    branches:
      - agent/item-consolidator-v0.2.7-r3-multidelete-only
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate exact R2 plus R3 multi-delete-only patch
        shell: pwsh
        run: .\tools\rehydrate_v027_r3.ps1
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Route logic self-test
        run: .\build\Release\route_logic_tests.exe
      - name: Rotation logic self-test
        run: .\build\Release\rotation_logic_tests.exe
      - name: Exact trade scheduler self-test
        run: .\build\Release\trade_logic_tests.exe
      - name: Static v0.2.7-R3 multi-delete-only audit
        shell: pwsh
        run: |
          $c = Get-Content generated\donor159\src\controller.cpp -Raw
          $blockMatch = [regex]::Match($c, '(?ms)^    void DeleteTradeSequenceRow\(\) \{.*?(?=^    void MoveTradeSequenceRow\()')
          if (-not $blockMatch.Success) { throw 'Cannot locate DeleteTradeSequenceRow block' }
          $block = $blockMatch.Value
          foreach ($required in @(
            'std::vector<int> rows = SelectedRows(tradeSeqList_);',
            'rows.erase(std::remove_if',
            'std::sort(rows.begin(), rows.end());',
            'std::binary_search(rows.begin(), rows.end(), cs.mainRef)',
            'std::lower_bound(rows.begin(), rows.end(), cs.mainRef)',
            'for (auto it = rows.rbegin(); it != rows.rend(); ++it) seq->erase(seq->begin() + *it);'
          )) {
            if ($block -notmatch [regex]::Escape($required)) { throw "Missing R3 multi-delete token: $required" }
          }
          if ($block -match [regex]::Escape('const int row = SelectedTradeSequenceIndex();')) {
            throw 'Old single-row delete selector still active inside DeleteTradeSequenceRow'
          }
          foreach ($required in @(
            'tradeRendezvous_', 'GroupSelectedTradeRows', 'ClickSlot::AutoMenu', 'DỪNG AUTO 2',
            'DỒN ĐỒ: BẬT', 'DỒN ĐỒ: TẮT', 'ToggleGlobalPause', 'CoordinatorClick',
            'mainSellThreshold_ = 6', 'childTriggerFreeSlots_ = 0'
          )) {
            if ($c -notmatch [regex]::Escape($required)) { throw "Protected R2 token missing: $required" }
          }
          foreach ($forbidden in @('tradeSelectPoint','TradeSelect','StopAuto1','tradeGlobalFreeze_','roundRobinCursor_')) {
            if ($c -match [regex]::Escape($forbidden)) { throw "Forbidden/removed token returned: $forbidden" }
          }
          if (([regex]::Matches($c, 'SendInput\(')).Count -ne 2) { throw 'Unexpected SendInput call count' }
          if (([regex]::Matches($c, 'RegisterHotKey\(hwnd_, kPauseHotkeyId, MOD_NOREPEAT, VK_F4\)')).Count -ne 1) { throw 'F4 registration invariant failed' }
          Write-Host 'V0.2.7-R3 STATIC AUDIT PASS: only trade-sequence multi-delete behavior added; protected R2 invariants retained'
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.2.7-R3.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
          Copy-Item README.md,PROJECT_KNOWLEDGE.md,CHANGELOG.md stage\
          Copy-Item macros stage\macros -Recurse
          Copy-Item docs\history\VERSION_v0.2.7-R3.md stage\VERSION_v0.2.7-R3.md
          Copy-Item docs\bugs\BUG_REGISTRY.md stage\BUG_REGISTRY.md
          Copy-Item docs\decisions\DECISIONS.md stage\DECISIONS.md
          Copy-Item docs\evidence\EVIDENCE_REGISTRY.md stage\EVIDENCE_REGISTRY.md
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.2.7-R3-win-x64
          path: stage
