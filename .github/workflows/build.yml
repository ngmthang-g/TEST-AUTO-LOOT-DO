name: build-item-consolidator-v025

on:
  push:
    branches:
      - main
      - agent/item-consolidator-v0.2.5-sell-freeze-editor-rec-fix
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rehydrate exact source through v0.2.5
        shell: pwsh
        run: .\tools\rehydrate_v159.ps1
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Route logic self-test
        run: .\build\Release\route_logic_tests.exe
      - name: Rotation logic self-test
        run: .\build\Release\rotation_logic_tests.exe
      - name: Exact trade scheduler self-test
        run: .\build\Release\trade_logic_tests.exe
      - name: Static v0.2.5 sell-freeze/editor/REC audit
        shell: pwsh
        run: |
          $c = Get-Content generated\donor159\src\controller.cpp -Raw
          foreach ($required in @(
            'coordinatorSequenceFreeze_',
            'coordinatorSequenceOwnerPid_',
            'AcquireCoordinatorSequenceFreeze',
            'ReleaseCoordinatorSequenceFreeze',
            'SEQUENCE LEASE',
            'CHUỖI CLICK BÁN ĐỒ',
            'FocusedSelectedRow',
            'LoadTradeSequenceRowToEditor(n->iItem)',
            'người dùng DỪNG AUTO acc thuộc workflow giao dịch',
            'người dùng mở REC → hủy workflow giao dịch đang treo',
            'coordinatorRecording_',
            'SetForegroundWindow',
            'SetCursorPos',
            'SendInput',
            'mainSellThreshold_ = 6',
            'childTriggerFreeSlots_ = 0'
          )) {
            if ($c -notmatch [regex]::Escape($required)) { throw "Missing v0.2.5 token: $required" }
          }
          if ($c -match 'tradeGlobalFreeze_') { throw 'obsolete whole-trade freeze must not return' }
          if ($c -match 'roundRobinCursor_') { throw 'fixed CON1..CON6 priority required' }
          $rawSend = ([regex]::Matches($c, 'SendInput\(')).Count
          if ($rawSend -ne 2) { throw "Unexpected SendInput call count: $rawSend" }
          Write-Host 'V0.2.5 SELL SEQUENCE FREEZE / EDITOR / REC STATIC AUDIT PASS'
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.2.5.exe
          Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
          Copy-Item README.md,PROJECT_KNOWLEDGE.md,CHANGELOG.md stage\
          Copy-Item macros stage\macros -Recurse
          Copy-Item docs\history\VERSION_v0.2.5.md stage\VERSION_v0.2.5.md
      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.2.5-win-x64
          path: stage
